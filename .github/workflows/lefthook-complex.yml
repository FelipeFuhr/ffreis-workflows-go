name: Lefthook Complex

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Heavy lefthook tier to run on the whole tree"
        type: choice
        options: [complex, release]
        default: complex

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lefthook-complex:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-lefthook-complex.yml@725560858c46d4b6f1f8ec5b7baba8695d05454a # v1.9.2
    with:
      working-directory: "."
      tier: ${{ inputs.tier }}
      setup-go: false
      install-golangci-lint: false
      install-govulncheck: false
      lefthook-bootstrap-command: "make lefthook-bootstrap"
      lefthook-bin: ".bin/lefthook"
