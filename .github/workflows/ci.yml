name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# Validates that every workflow defined in this library functions correctly
# against the minimal example app in examples/hello/.
#
# go-sonar requires SONAR_TOKEN to be configured in the repository. The job
# is skipped on fork pull requests (secrets are not available to forks), but
# runs on all other events and fails if the token is absent.
#
# go-deepsource-coverage requires DEEPSOURCE_DSN to be configured in the repository.
# The job is skipped on fork pull requests.
#
# go-snyk requires SNYK_TOKEN plus ENABLE_SNYK=true in repository or organization
# variables. Without that variable the job is explicitly skipped. Fork pull
# requests are also skipped.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci-local-coverage:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-ci-local-coverage.yml@12c41714d56ff512e8093cd96a2ab11e60aced17
    with:
      mode: defines
      enforce: true

  workflows-policy:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-workflows-policy.yml@725560858c46d4b6f1f8ec5b7baba8695d05454a # v1.9.2
    with:
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  codeql-actions:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@725560858c46d4b6f1f8ec5b7baba8695d05454a # v1.9.2
    with:
      languages: actions
      source-root: .
      upload-sarif: false
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  fmt:
    permissions:
      contents: read
    uses: ./.github/workflows/go-fmt.yml
    with:
      working-directory: examples/hello
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  lint:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/go-lint.yml
    with:
      working-directory: examples/hello
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  build:
    permissions:
      contents: read
    uses: ./.github/workflows/go-build.yml
    with:
      working-directory: examples/hello
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  test:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      id-token: write # permissions-mirror: go-test.yml needs this for L2 S3 cache OIDC
    uses: ./.github/workflows/go-test.yml
    with:
      working-directory: examples/hello
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  fuzz:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    uses: ./.github/workflows/go-fuzz.yml
    with:
      working-directory: examples/hello
      fuzz-targets: FuzzParseExpr
      fuzz-time: 10s
      fuzz-parallelism: 1
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  mutation:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    uses: ./.github/workflows/go-mutation.yml
    with:
      working-directory: examples/hello
      packages: ./calculator
      threshold: 50
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  sonar:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/go-sonar.yml
    with:
      working-directory: examples/hello
      run-on-pr: true
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security:
    permissions:
      contents: read
    uses: ./.github/workflows/go-security.yml
    with:
      working-directory: examples/hello
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  coverage:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    uses: ./.github/workflows/go-coverage.yml
    with:
      working-directory: examples/hello
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-coverage:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    uses: ./.github/workflows/go-integration-coverage.yml
    with:
      working-directory: examples/hello
      # examples/hello/calculator ships one integration-tagged test
      # (calculator_integration_test.go) purely to exercise this gate in
      # self-test; 60 is illustrative, not a fleet-wide floor recommendation.
      coverage-threshold: 60
      # examples/hello/generated is an untested generated-code fixture; without
      # this the example sinks to 37.5% and this gate fails on its own fixture.
      coverage-exclude: '/generated/'
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Self-test for coverage-exclude. This job is the proof, not the docs: the
  # threshold is set above what examples/hello scores WITH the generated
  # fixture counted (37.5%) and below what it scores without it (67.7%), so it
  # passes only while the input actually drops those entries. Delete the
  # `coverage-exclude` line below and this job goes red.
  coverage-exclude-generated:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    uses: ./.github/workflows/go-coverage.yml
    with:
      working-directory: examples/hello
      coverage-exclude: '/generated/'
      coverage-threshold: 60
      codecov-flags: unit-excl-generated
      codecov-name: coverage-exclude-generated-selftest
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-coverage-dynamodb-local:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    # Smoke test for the dynamodb-local input: proves a real DynamoDB Local
    # container actually starts, becomes reachable, answers a real DynamoDB
    # API call, and gets cleaned up — not just that the YAML parses. Needs
    # Docker, which the self-hosted "local" default doesn't have yet (same
    # constraint go-container.yml already documents), hence the runner
    # override.
    uses: ./.github/workflows/go-integration-coverage.yml
    with:
      runner: '["ubuntu-latest"]'
      working-directory: examples/hello
      dynamodb-local: true
      codecov-flags: integration-smoke
      codecov-name: integration-coverage-dynamodb-local-smoke
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docs:
    permissions:
      contents: read
    uses: ./.github/workflows/go-docs.yml
    with:
      working-directory: examples/hello
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  semgrep:
    permissions:
      contents: read
    uses: ./.github/workflows/go-semgrep.yml
    with:
      working-directory: examples/hello
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  semgrep-sarif:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/go-semgrep-sarif.yml
    with:
      working-directory: examples/hello
      upload-sarif: true
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  container:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/go-container.yml
    with:
      image: hello-example
      push: false
      containerfile: examples/hello/Containerfile
      working-directory: examples/hello

  mod-tidy:
    permissions:
      contents: read
    uses: ./.github/workflows/go-mod-tidy-check.yml
    with:
      working-directory: examples/hello
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  snyk:
    if: vars.ENABLE_SNYK == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/go-snyk.yml
    with:
      working-directory: examples/hello
      upload-sarif: false
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  deepsource-coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/go-deepsource-coverage.yml
    with:
      working-directory: examples/hello
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'
    secrets:
      DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}

  cross-build-matrix:
    permissions:
      contents: read
    uses: ./.github/workflows/go-cross-build-matrix.yml
    with:
      go-version: "1.25.8"
      working-directory: examples/hello
      targets: |-
        ./...
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'
