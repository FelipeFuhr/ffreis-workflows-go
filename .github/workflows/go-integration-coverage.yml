name: Go Integration Coverage (Codecov)

# Parallel modality to go-coverage.yml: gates line coverage of tests built
# with a dedicated build tag (fleet convention: //go:build integration),
# tracked and enforced as a separate metric from unit coverage.
#
# Fleet convention (see platform-bootstrap's internal/bootstrap package):
# integration-tagged test files coexist in the same package as untagged unit
# test files, so `go test -tags=<build-tag> ./...` naturally runs BOTH sets
# together (untagged files are always included; tagged files are added on
# top). That means a repo with zero files carrying the build tag would still
# "pass" a naive run of this workflow — it would just silently re-report unit
# coverage under a different name, which is a false signal, not an empty one.
# The "Detect integration-tagged test files" step below guards against this:
# it greps for the build-tag comment itself and skips the test run + gate
# entirely when no file declares it, rather than let a repo that hasn't
# adopted integration testing yet spuriously pass (or fail) the gate.

on:
  workflow_call:
    inputs:
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'
      go-version:
        description: "Go version to use"
        type: string
        default: "1.25"
      working-directory:
        description: "Directory containing the Go module"
        type: string
        default: "."
      build-tag:
        description: 'Go build tag that marks integration tests (e.g. "//go:build integration")'
        required: false
        type: string
        default: "integration"
      test-timeout:
        description: "Timeout passed to go test -timeout"
        type: string
        default: "120s"
      coverage-threshold:
        description: "Minimum integration line coverage percentage (0 = no gate)"
        type: number
        default: 0
      coverage-exclude:
        description: >
          Extended regular expression (ERE) matched against the FILE PATHS in
          the coverage profile. Matching entries are dropped before the
          threshold is measured and before the profile is uploaded, so the
          gate, the Codecov report and a repo's local `make coverage` all
          report the same number. Intended for GENERATED code — protobuf,
          mocks, sqlc, ent — where a surviving statement is a fact about the
          generator, not about the repo. Example: '/proto/gen/'.
          Tests still RUN over the excluded packages: only the profile is
          filtered, never `go test ./...`, so a build break in generated code
          still fails the job. Empty (the default) measures everything.
          A pattern that matches NOTHING fails the job rather than passing
          quietly — see the filter step.
        required: false
        type: string
        default: ""
      codecov-flags:
        description: "Codecov flags"
        type: string
        default: "integration"
      codecov-name:
        description: "Codecov report name"
        type: string
        default: "integration-coverage"
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      goprivate:
        description: >
          Comma-separated GOPRIVATE glob pattern(s) for private cross-repo Go
          dependencies (e.g. 'github.com/FelipeFuhr/*'). Empty (default) leaves
          GOPRIVATE/git auth untouched — zero-impact for existing callers.
        required: false
        type: string
        default: ""
      dynamodb-local:
        description: >
          When true, starts a real amazon/dynamodb-local container before the
          test step and stops it after (even on failure), exporting
          DYNAMODB_ENDPOINT=http://localhost:8000 so integration tests can
          validate real conditional-write / optimistic-locking behavior
          instead of a hand-rolled fake. Requires a runner with a working
          container runtime — the self-hosted "local" default does not have
          one provisioned yet (same constraint go-container.yml already
          documents), so pass runner: '["ubuntu-latest"]' alongside this.
          Default false — zero behavior change for existing callers.
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false
      GIT_AUTH_TOKEN:
        description: "Token for private cross-repo Go module access (used with goprivate)"
        required: false

jobs:
  integration-coverage:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 30
    permissions:
      contents: read
    name: Integration Coverage (go test + Codecov)
    runs-on: ${{ fromJson(inputs.runner) }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure private Go module access
        if: ${{ inputs.goprivate != '' }}
        env:
          GOPRIVATE_INPUT: ${{ inputs.goprivate }}
          GIT_AUTH_TOKEN: ${{ secrets.GIT_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "GOPRIVATE=${GOPRIVATE_INPUT}"
            echo "GONOSUMCHECK=1"
          } >> "$GITHUB_ENV"
          if [ -n "$GIT_AUTH_TOKEN" ]; then
            git config --global url."https://x-access-token:${GIT_AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Detect integration-tagged test files
        id: detect
        env:
          BUILD_TAG: ${{ inputs.build-tag }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if grep -rlE --include='*.go' \
              -e "^//go:build.*\\<${BUILD_TAG}\\>" \
              -e "^// \\+build.*\\<${BUILD_TAG}\\>" \
              . >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No Integration Tests::No files carrying the '${BUILD_TAG}' build tag were found under ${WORKING_DIRECTORY}; skipping the integration-coverage run and gate."
          fi

      - name: Start DynamoDB Local
        id: start-dynamodb
        if: ${{ steps.detect.outputs.found == 'true' && inputs.dynamodb-local }}
        run: |
          set -euo pipefail
          container_id=$(docker run -d --rm \
            -p 8000:8000 \
            amazon/dynamodb-local:3.3.1 \
            -jar DynamoDBLocal.jar -inMemory -sharedDb)
          echo "container_id=${container_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for DynamoDB Local
        if: ${{ steps.detect.outputs.found == 'true' && inputs.dynamodb-local }}
        env:
          CONTAINER_ID: ${{ steps.start-dynamodb.outputs.container_id }}
        run: |
          set -euo pipefail
          # DynamoDB Local answers any HTTP request (even an unsigned/malformed
          # one) with a real HTTP response once it's up, so "curl completed a
          # transaction" (exit 0, regardless of status code — no -f) is a true
          # readiness signal here, not just "the TCP port accepted a connection".
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8000/; then
              echo "DynamoDB Local is ready on port 8000 (after ${i}s)."
              exit 0
            fi
            sleep 1
          done
          echo "::error::DynamoDB Local did not become reachable on port 8000 within 30s."
          docker logs "$CONTAINER_ID" || true
          exit 1

      - name: Verify DynamoDB Local API responds
        if: ${{ steps.detect.outputs.found == 'true' && inputs.dynamodb-local }}
        env:
          # DynamoDB Local does not verify these against a real AWS account —
          # it only needs *some* credentials present so the CLI will sign the
          # request. This call is a second, stronger proof beyond the curl
          # readiness loop above: a real DynamoDB API round-trip, not just an
          # open port.
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          aws dynamodb list-tables --endpoint-url http://localhost:8000

      - name: Run integration tests with coverage
        if: steps.detect.outputs.found == 'true'
        env:
          TEST_TIMEOUT: ${{ inputs.test-timeout }}
          BUILD_TAG: ${{ inputs.build-tag }}
          DYNAMODB_ENDPOINT: ${{ inputs.dynamodb-local && 'http://localhost:8000' || '' }}
        run: |
          set -euo pipefail
          go test ./... \
            -tags="$BUILD_TAG" \
            -coverprofile=coverage-integration.out \
            -covermode=atomic \
            -count=1 \
            -timeout="$TEST_TIMEOUT"

      - name: Stop DynamoDB Local
        if: ${{ always() && inputs.dynamodb-local }}
        env:
          CONTAINER_ID: ${{ steps.start-dynamodb.outputs.container_id }}
        run: |
          if [ -n "$CONTAINER_ID" ]; then
            docker stop "$CONTAINER_ID" 2>/dev/null || true
          fi

      # The detect guard is required, not decorative: when no file declares the
      # build tag the test step above never ran, so there is no profile to
      # filter and an unguarded filter would fail the job on a repo that simply
      # has no integration tests yet.
      - name: Exclude generated code from the coverage measurement
        if: ${{ steps.detect.outputs.found == 'true' && inputs.coverage-exclude != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          COVERAGE_EXCLUDE: ${{ inputs.coverage-exclude }}
          PROFILE: coverage-integration.out
        run: |
          set -euo pipefail

          # Line 1 of a Go coverage profile is the mode header ("mode: atomic").
          # It is not a file entry and must survive the filter, or every later
          # `go tool cover` call fails with "bad mode line".
          before_pct=$(go tool cover -func="$PROFILE" | tail -1 | awk '{print $3}')
          before_lines=$(tail -n +2 "$PROFILE" | wc -l | tr -d ' ')

          head -1 "$PROFILE" > "$PROFILE.filtered"
          tail -n +2 "$PROFILE" | grep -Ev "$COVERAGE_EXCLUDE" >> "$PROFILE.filtered" || true

          after_lines=$(tail -n +2 "$PROFILE.filtered" | wc -l | tr -d ' ')
          dropped=$((before_lines - after_lines))

          # A filter that matches nothing is the failure mode this input exists
          # to avoid repeating: the gate would look configured while excluding
          # nothing, and the number it reports would silently be the unfiltered
          # one. Refuse rather than pass.
          if [ "$dropped" -eq 0 ]; then
            echo "::error::coverage-exclude '$COVERAGE_EXCLUDE' matched no entries in $PROFILE."
            echo "::error::Nothing was excluded, so this gate is not measuring what it claims."
            echo "::error::Fix or remove the pattern. Profile paths look like:"
            tail -n +2 "$PROFILE" | cut -d: -f1 | sort -u | head -20
            exit 1
          fi

          # Everything excluded would make the percentage meaningless (and
          # `go tool cover` reports no total line at all for an empty profile).
          if [ "$after_lines" -eq 0 ]; then
            echo "::error::coverage-exclude '$COVERAGE_EXCLUDE' matched EVERY entry in $PROFILE."
            echo "::error::There is nothing left to measure. Narrow the pattern."
            exit 1
          fi

          mv "$PROFILE.filtered" "$PROFILE"
          after_pct=$(go tool cover -func="$PROFILE" | tail -1 | awk '{print $3}')
          echo "coverage-exclude '$COVERAGE_EXCLUDE': dropped $dropped of $before_lines profile entries"
          echo "  before: $before_pct   after: $after_pct"

      - name: Coverage summary
        if: steps.detect.outputs.found == 'true'
        run: go tool cover -func=coverage-integration.out | tail -1

      - name: Enforce coverage threshold
        if: ${{ steps.detect.outputs.found == 'true' && inputs.coverage-threshold > 0 }}
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          set -euo pipefail
          PCT=$(go tool cover -func=coverage-integration.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Integration line coverage: ${PCT}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk "BEGIN { exit (${PCT} < ${COVERAGE_THRESHOLD}) ? 1 : 0 }" || {
            echo "::error::Integration coverage ${PCT}% is below the required threshold of ${COVERAGE_THRESHOLD}%"
            exit 1
          }

      - name: Upload coverage to Codecov
        if: ${{ steps.detect.outputs.found == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          files: coverage-integration.out
          flags: ${{ inputs.codecov-flags }}
          name: ${{ inputs.codecov-name }}
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
