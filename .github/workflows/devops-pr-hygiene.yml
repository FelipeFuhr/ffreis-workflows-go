name: DevOps / PR Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: devops-pr-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-pr:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-semantic-pr.yml@725560858c46d4b6f1f8ec5b7baba8695d05454a # v1.9.2
    with:
      require-scope: false
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'

  actionlint:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-actionlint.yml@725560858c46d4b6f1f8ec5b7baba8695d05454a # v1.9.2
    with:
      working-directory: "."
      # public repo: self-hosted runners are structurally unavailable here
      runner: '["ubuntu-latest"]'
