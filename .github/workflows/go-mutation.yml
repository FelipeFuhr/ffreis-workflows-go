name: Go Mutation Testing

# Reusable workflow — callers invoke via:
#   uses: ./.github/workflows/go-mutation.yml
#
# Intended schedule: weekly (Sunday 02:00 UTC) or workflow_dispatch.
# Do NOT run on every PR — mutation testing takes 5–30 min per repo.
#
# Exit behaviour:
#   - exit 0  → mutation score ≥ threshold   (pass)
#   - exit 1  → mutation score  < threshold  (fail CI)

on:
  workflow_call:
    inputs:
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'
      go-version:
        description: 'Go version to use'
        required: false
        type: string
        default: '1.25'
      working-directory:
        description: 'Directory containing go.mod'
        required: false
        type: string
        default: '.'
      packages:
        description: 'Packages to mutate (space-separated), e.g. "./internal/engine/... ./internal/rule/..."'
        required: false
        type: string
        default: './internal'
      threshold:
        description: 'Minimum mutation efficacy score (0–100). CI fails if score is below this.'
        required: false
        type: number
        default: 60
      gremlins-version:
        description: 'gremlins version tag to install, e.g. "v0.5.0".'
        required: false
        type: string
        default: 'v0.6.0'
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      goprivate:
        description: >
          Comma-separated GOPRIVATE glob pattern(s) for private cross-repo Go
          dependencies (e.g. 'github.com/FelipeFuhr/*'). Empty (default) leaves
          GOPRIVATE/git auth untouched — zero-impact for existing callers.
        required: false
        type: string
        default: ""
      in-diff:
        description: >-
          On pull_request events, mutate ONLY the non-test .go files this PR
          changed (gremlins' native -D/--diff) instead of the whole
          `packages` tree. Intended as a fast PR-time gate that complements
          — not replaces — the existing weekly/monthly `schedule:` run,
          which stays the full sweep that recovers whole-module coverage.

          TWO CORRECTNESS GOTCHAS, found by probing gremlins v0.6.0 directly
          (v0.6.0 is latest per `go list -m -versions` — nothing newer to
          upgrade to):

          1. gremlins' `--diff` match is PATH-FORMAT SENSITIVE: it compares
          each mutant's AST position (recorded relative to whatever
          directory `unleash [path]` was given) against `git diff`'s
          REPO-ROOT-relative paths. Invoking it per-package the way the
          non-diff path below does (e.g. `gremlins unleash --diff <ref>
          internal`) makes EVERY mutant mismatch and report SKIPPED — even
          ones inside files the diff did change. Reproduced directly: a
          diff touching only `internal/b.go` scored "Test efficacy: 0.00%"
          (0 killed, 0 lived — a vacuous FAIL, not the usual vacuous-pass
          failure mode) when `unleash`'d against `internal`, and the
          correct 100% (2 real mutants KILLED, the untouched file's mutant
          correctly SKIPPED) once invoked at the module root with path ".".
          So when in-diff is active this workflow ALWAYS calls gremlins
          with path "." — never the `packages` loop — which is only
          correct when `working-directory` IS the git repository root; a
          guard step below fails loudly (rather than silently scoping
          wrong) if it isn't.

          2. An EMPTY diff does not make gremlins skip anything: internally,
          `Diff.IsChanged` returns true for every position when its diff map
          is empty, so a PR that changes no .go file makes gremlins silently
          fall back to mutating the WHOLE module — the same cost as not
          passing `--diff` at all, exactly backwards from the fast no-op
          you'd want. So this workflow computes the merge-base diff itself
          first (scoped to non-test `*.go` files — gremlins never mutates
          `_test.go`, so a diff touching only tests has nothing for `--diff`
          to find either) and skips invoking gremlins entirely when that
          diff is empty, rather than relying on gremlins' own fallback.

          Ignored on non-pull_request events, which have no base to diff.
        required: false
        type: boolean
        default: false
    outputs:
      mutation-score:
        description: 'Achieved mutation efficacy score (integer, 0–100)'
        value: ${{ jobs.mutation.outputs.score }}
    secrets:
      GIT_AUTH_TOKEN:
        description: "Token for private cross-repo Go module access (used with goprivate)"
        required: false

jobs:
  mutation:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 30
    permissions:
      contents: read
    name: Mutation score (gremlins)
    runs-on: ${{ fromJson(inputs.runner) }}
    outputs:
      score: ${{ steps.run.outputs.score }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # fetch-depth 0 only when in-diff needs a merge-base against the PR's
          # base branch. Quoted so the boolean ternary doesn't silently
          # evaluate `inputs.in-diff && 0 || 1` to the unquoted-0 footgun
          # ffreis-workflows-rust's rust-mutation.yml already documents (bare
          # `0` is falsy to the `||`, so it would always fall through to 1).
          fetch-depth: ${{ inputs.in-diff && '0' || '1' }}

      - name: Configure private Go module access
        if: ${{ inputs.goprivate != '' }}
        env:
          GOPRIVATE_INPUT: ${{ inputs.goprivate }}
          GIT_AUTH_TOKEN: ${{ secrets.GIT_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "GOPRIVATE=${GOPRIVATE_INPUT}"
            echo "GONOSUMCHECK=1"
          } >> "$GITHUB_ENV"
          if [ -n "$GIT_AUTH_TOKEN" ]; then
            git config --global url."https://x-access-token:${GIT_AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      # Computes whether there is anything for --diff to find, BEFORE
      # installing gremlins — see the `in-diff` input for why gremlins
      # itself cannot be trusted to make this call (an empty diff makes it
      # silently fall back to a full run, not a no-op).
      - name: Compute PR diff for --diff
        id: diff
        if: ${{ inputs.in-diff && github.event_name == 'pull_request' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # gremlins computes its OWN `git diff --merge-base <ref>` from
          # whatever directory it is invoked in, using REPO-ROOT-relative
          # paths unconditionally (no --relative equivalent exists to scope
          # it to a subdirectory the way cargo-mutants' --in-diff is scoped
          # in ffreis-workflows-rust). So in-diff only matches correctly when
          # this job's working-directory IS the repo root — verify that
          # before doing anything else, rather than silently producing a
          # gate that scores every mutant SKIPPED.
          toplevel="$(git rev-parse --show-toplevel)"
          if [[ "$(pwd -P)" != "$(cd "$toplevel" && pwd -P)" ]]; then
            echo "::error title=Mutation diff error::in-diff requires working-directory to be the git repository root. gremlins matches its own git-diff output (repo-root-relative paths) against each mutant's AST position (relative to the 'path' given to 'unleash') — any other combination mismatches silently, scoring every mutant SKIPPED. Set working-directory to the repo root, or drop in-diff for this caller."
            exit 1
          fi

          base=""
          for candidate in "origin/${BASE_REF}" "${BASE_REF}"; do
            if git rev-parse --verify --quiet "$candidate" >/dev/null 2>&1; then
              base="$candidate"
              break
            fi
          done
          if [[ -z "$base" ]]; then
            echo "::error title=Mutation diff error::cannot resolve base ref '${BASE_REF}'. Ensure the checkout used fetch-depth: 0."
            exit 1
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"

          # Mirrors gremlins' own merge-base diff exactly, so "is there
          # anything to mutate" agrees with what --diff "$base" will itself
          # scope. Test files are excluded: gremlins never mutates
          # `_test.go` (internal/engine/engine.go), so a diff touching only
          # tests has nothing for --diff to find either.
          changed=$(git diff --merge-base "$base" --name-only -- '*.go' \
            | grep -vc '_test\.go$' || true)

          if [[ "${changed:-0}" -eq 0 ]]; then
            echo "result=empty" >> "$GITHUB_OUTPUT"
            echo "::notice title=Mutation skipped::This PR changes no non-test .go file, so there is nothing to mutate."
          else
            echo "result=ok" >> "$GITHUB_OUTPUT"
            echo "Mutating only lines changed by this PR (${changed} changed .go file(s))."
          fi

      # Build the test binary cache before gremlins starts mutating —
      # avoids redundant compilation on every mutant. Skipped when in-diff
      # already determined there is nothing to mutate.
      - name: Pre-build test binary cache
        if: ${{ steps.diff.outputs.result != 'empty' }}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          read -r -a packages_arr <<< "${PACKAGES:-}"
          go test -run='^$' "${packages_arr[@]}" 2>/dev/null || true

      - name: Install gremlins
        if: ${{ steps.diff.outputs.result != 'empty' }}
        env:
          GREMLINS_VERSION: ${{ inputs.gremlins-version }}
        run: |
          set -euo pipefail
          go install github.com/go-gremlins/gremlins/cmd/gremlins@"$GREMLINS_VERSION"

      - name: Run mutation testing
        id: run
        env:
          THRESHOLD: ${{ inputs.threshold }}
          PACKAGES: ${{ inputs.packages }}
          IN_DIFF: ${{ inputs.in-diff && github.event_name == 'pull_request' }}
          DIFF_RESULT: ${{ steps.diff.outputs.result }}
          DIFF_BASE: ${{ steps.diff.outputs.base }}
        run: |
          set -euo pipefail

          if [[ "${DIFF_RESULT:-}" == "empty" ]]; then
            echo "score=100" >> "$GITHUB_OUTPUT"
            echo "::notice title=Mutation Score::Nothing to mutate — marking as passed."
            exit 0
          fi

          exit_code=0
          min_score=""

          # Shared per-invocation runner: gremlins' `unleash [path]` takes
          # exactly ONE plain directory path (never a go-list `...` pattern,
          # never several space-separated paths — more than one array
          # element in a single call fails loudly with "accepts at most 1
          # arg(s)"). "No results to report" (nothing mutable at this path —
          # e.g. an empty or fully-excluded directory) is counted as a skip,
          # not folded into min_score as 0: that distinction is what keeps a
          # trivial/empty package from dragging an otherwise-healthy score
          # down to a vacuous fail.
          run_gremlins() {
            local path="$1"; shift
            local output pkg_score
            output=$(gremlins unleash --threshold-efficacy="$THRESHOLD" "$@" "$path" 2>&1) || exit_code=1
            echo "$output"
            if grep -q 'No results to report' <<< "$output"; then
              return
            fi
            pkg_score=$(echo "$output" | grep -ioE 'efficacy:[[:space:]]*[0-9]+' | grep -oE '[0-9]+' | head -1 || echo "0")
            if [[ -z "$min_score" || "$pkg_score" -lt "$min_score" ]]; then
              min_score="$pkg_score"
            fi
          }

          if [[ "${IN_DIFF:-false}" == "true" ]]; then
            # Whole-diff scope, not `packages`: gremlins' --diff only matches
            # correctly at the module root (see the in-diff input's own
            # description for why) — packages-based scoping does not apply
            # to this invocation.
            echo "==> gremlins unleash --diff ${DIFF_BASE} ."
            run_gremlins "." --diff "$DIFF_BASE"
          else
            # gremlins' `unleash [path]` takes exactly ONE plain directory
            # path: not a go-list `...` pattern, and not several
            # space-separated paths in one call. More than one array element
            # in a single invocation fails loudly ("accepts at most 1
            # arg(s)"), but a SINGLE `...`-suffixed path (the documented
            # default, e.g. "./internal/...") fails silently -- gremlins
            # doesn't understand the glob, prints "No results to report."
            # and still exits 0, a vacuous pass (zero mutants tested, gate
            # still green). Loop over each entry instead, stripping the
            # trailing "/..." each one carries for go-test-flag
            # compatibility, running gremlins once per package and
            # propagating the worst exit code + minimum score across the
            # run. Mirrors the fix already applied in
            # ffreis-platform-configctl's own Makefile `mutation:` target.
            read -r -a packages_arr <<< "${PACKAGES:-}"
            for pkg in "${packages_arr[@]}"; do
              path="${pkg%/...}"
              echo "==> gremlins unleash $path"
              run_gremlins "$path"
            done
          fi

          score="${min_score:-0}"
          echo "score=${score}" >> "$GITHUB_OUTPUT"

          echo "::notice title=Mutation Score::Efficacy: ${score}% (threshold: ${THRESHOLD}%)"

          exit "$exit_code"

      - name: Annotate score
        if: always()
        env:
          SCORE: ${{ steps.run.outputs.score }}
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          if [[ "${SCORE:-0}" -lt "$THRESHOLD" ]]; then
            echo "::error title=Mutation Score Too Low::Score ${SCORE}% is below threshold ${THRESHOLD}%. Add tests that kill more mutants."
          else
            echo "::notice title=Mutation Score OK::Score ${SCORE}% ≥ threshold ${THRESHOLD}%."
          fi
