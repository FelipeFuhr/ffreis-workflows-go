sonar.projectKey=felipefuhr_ffreis-workflows-go
sonar.organization=ffreis-org
# generated/ is the machine-generated fixture for go-coverage.yml's
# coverage-exclude input. Sonar measures coverage independently of the
# workflow gate, so it needs the exclusion stated in its own config too --
# otherwise the gate reports 67.7% and Sonar reports 37.5% for the same code.
sonar.coverage.exclusions=main.go,generated/**
